name: Sync LeetCode to Blog

on:
  push:
    branches:
      - main
  workflow_dispatch: # 👈 깃허브에서 수동으로 "Run" 버튼을 누를 수 있게 해주는 코드

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LeetCode Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Files (Check if Push or Manual)
        id: get-files
        run: |
          # 수동으로 실행(workflow_dispatch)했으면 리포지토리 내 모든 마크다운 파일을 타겟으로 삼음
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: Fetching all markdown files..."
            FILES=$(find . -name "*.md" ! -path "./.github/*" ! -path "./output_posts/*")
          else
            echo "Push trigger: Fetching only changed markdown files..."
            FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '\.md$' || true)
          fi
          echo "FILES=$FILES" >> $GITHUB_ENV

      - name: Transform and Copy Files
        if: env.FILES != ''
        run: |
          mkdir -p output_posts
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M:%S +0900')
          FILE_DATE=$(date +'%Y-%m-%d')
          
          for file in ${{ env.FILES }}; do
            FILENAME=$(basename "$file")
            TITLE=$(basename "$file" .md | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')
            BLOG_FILENAME="${FILE_DATE}-${FILENAME}"
            
            echo "Processing: $file -> output_posts/$BLOG_FILENAME"
            
            echo "---" > "output_posts/$BLOG_FILENAME"
            echo "layout: post" >> "output_posts/$BLOG_FILENAME"
            echo "title: \"[LeetCode] $TITLE\"" >> "output_posts/$BLOG_FILENAME"
            echo "date: $CURRENT_DATE" >> "output_posts/$BLOG_FILENAME"
            echo "categories: [CodingTest, LeetCode]" >> "output_posts/$BLOG_FILENAME"
            echo "tags: [leetcode, algorithm]" >> "output_posts/$BLOG_FILENAME"
            echo "---" >> "output_posts/$BLOG_FILENAME"
            echo "" >> "output_posts/$BLOG_FILENAME"
            
            cat "$file" >> "output_posts/$BLOG_FILENAME"
          done

      - name: Push to Blog Repo
        if: env.FILES != ''
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.BLOG_PUSH_TOKEN }}
        with:
          source-directory: 'output_posts'
          destination-repository-username: 'SonMyungJi'
          destination-repository-name: 'SonMyungJi.github.io'
          target-branch: 'main'
          target-directory: '_posts'
          user-email: 'linolousky@gmail.com'
          user-name: '손명지'
          commit-message: 'Feat: Bulk sync LeetCode solutions from GitHub Actions'
